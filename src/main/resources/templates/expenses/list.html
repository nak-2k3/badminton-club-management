<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Quản lý khoản chi</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5 mb-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2>Quản lý khoản chi</h2>
          <p class="text-muted mb-0">
            Theo dõi các khoản chi của câu lạc bộ như tiền sân, tiền cầu, nước
            uống, giải đấu...
          </p>
        </div>

        <a th:href="@{/expenses/create}" class="btn btn-success">
          Thêm khoản chi
        </a>
      </div>

      <div class="row mb-4">
        <div class="col-md-4">
          <div class="card border-danger shadow-sm">
            <div class="card-body">
              <h6 class="text-muted">Tổng tiền đã chi</h6>

              <h3
                class="text-danger mb-0"
                th:text="${#numbers.formatInteger(totalExpenseAmount, 0, 'COMMA')} + ' VNĐ'"
              ></h3>
            </div>
          </div>
        </div>
      </div>

      <table class="table table-bordered table-striped align-middle">
        <thead class="table-dark">
          <tr>
            <th>STT</th>
            <th>Tên khoản chi</th>
            <th>Số tiền</th>
            <th>Ngày chi</th>
            <th>Hình thức</th>
            <th>Ghi chú</th>
            <th>Hành động</th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="expense, stat : ${expenses}">
            <td th:text="${stat.count}"></td>

            <td>
              <strong th:text="${expense.title}"></strong>
            </td>

            <td
              class="text-danger fw-bold"
              th:text="${#numbers.formatInteger(expense.amount, 0, 'COMMA')} + ' VNĐ'"
            ></td>

            <td
              th:text="${expense.expenseDate != null ? #temporals.format(expense.expenseDate, 'dd/MM/yyyy') : '-'}"
            ></td>

            <td
              th:text="${expense.paymentMethod != null && !expense.paymentMethod.isEmpty() ? expense.paymentMethod : '-'}"
            ></td>

            <td
              th:text="${expense.note != null && !expense.note.isEmpty() ? expense.note : '-'}"
            ></td>

            <td>
              <a
                th:href="@{/expenses/edit/{id}(id=${expense.id})}"
                class="btn btn-warning btn-sm"
              >
                Sửa
              </a>

              <a
                th:href="@{/expenses/delete/{id}(id=${expense.id})}"
                class="btn btn-danger btn-sm"
                onclick="
                  return confirm('Bạn có chắc muốn xóa khoản chi này không?');
                "
              >
                Xóa
              </a>
            </td>
          </tr>

          <tr th:if="${#lists.isEmpty(expenses)}">
            <td colspan="7" class="text-center text-muted">
              Chưa có khoản chi nào.
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
