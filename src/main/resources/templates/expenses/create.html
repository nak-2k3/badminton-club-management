<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <title>Thêm khoản chi</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>

  <body
    hx-boost="true"
    hx-target="#main-content"
    hx-select="#main-content"
    hx-push-url="true"
    hx-swap="innerHTML"
  >
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main id="main-content" class="app-main">
      <div class="container app-page-container">
        <div class="page-header">
          <div>
            <h2 class="page-title">Thêm khoản chi</h2>

            <p class="page-subtitle">
              Ghi nhận khoản chi mới của câu lạc bộ như tiền sân, tiền cầu, nước
              uống hoặc chi phí phát sinh.
            </p>
          </div>

          <div class="page-actions">
            <a th:href="@{/expenses}" class="btn btn-outline-secondary">
              Quay lại
            </a>
          </div>
        </div>

        <div class="card">
          <div class="card-header bg-dark text-white">Thông tin khoản chi</div>

          <div class="card-body">
            <form
              th:action="@{/expenses/save}"
              th:object="${expense}"
              method="post"
              data-disable-submit="true"
            >
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">
                    Tên khoản chi
                    <span class="text-danger">*</span>
                  </label>

                  <input
                    type="text"
                    th:field="*{title}"
                    class="form-control"
                    placeholder="Ví dụ: Tiền sân tháng 6"
                    required
                  />
                </div>

                <div class="col-md-6">
                  <label class="form-label">
                    Số tiền
                    <span class="text-danger">*</span>
                  </label>

                  <input
                    type="number"
                    th:field="*{amount}"
                    class="form-control"
                    min="1000"
                    step="1000"
                    placeholder="Ví dụ: 3000000"
                    required
                  />

                  <div class="form-text">
                    Nhập số tiền không dùng dấu chấm. Ví dụ: 3000000.
                  </div>
                </div>

                <div class="col-md-6">
                  <label class="form-label">Ngày chi</label>

                  <input
                    type="text"
                    th:field="*{expenseDate}"
                    class="form-control date-picker"
                    placeholder="Chọn ngày chi"
                    autocomplete="off"
                  />
                </div>

                <div class="col-md-6">
                  <label class="form-label">Hình thức chi</label>

                  <select th:field="*{paymentMethod}" class="form-select">
                    <option value="Tiền mặt">Tiền mặt</option>
                    <option value="Chuyển khoản">Chuyển khoản</option>
                  </select>
                </div>

                <div class="col-12">
                  <label class="form-label">Ghi chú</label>

                  <textarea
                    th:field="*{note}"
                    class="form-control"
                    rows="3"
                    placeholder="Ví dụ: Thanh toán tiền sân tháng 6"
                  ></textarea>
                </div>
              </div>

              <hr class="my-4" />

              <div class="d-flex justify-content-end gap-2">
                <a th:href="@{/expenses}" class="btn btn-outline-secondary">
                  Hủy
                </a>

                <button type="submit" class="btn btn-success">
                  Lưu khoản chi
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script th:src="@{/js/app.js}"></script>
  </body>
</html>
