<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <title>Đổi mật khẩu</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>

  <body
    hx-boost="true"
    hx-target="#main-content"
    hx-select="#main-content"
    hx-push-url="true"
    hx-swap="innerHTML"
  >
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main id="main-content" class="app-main">
      <div class="container app-page-container">
        <div class="page-header">
          <div>
            <h2 class="page-title">Đổi mật khẩu</h2>

            <p class="page-subtitle">
              Cập nhật mật khẩu đăng nhập để bảo vệ tài khoản của bạn.
            </p>
          </div>

          <div class="page-actions">
            <a th:href="@{/profile}" class="btn btn-outline-secondary">
              Quay lại
            </a>
          </div>
        </div>

        <div class="card mx-auto" style="max-width: 680px">
          <div class="card-header bg-dark text-white">Thông tin mật khẩu</div>

          <div class="card-body">
            <div
              th:if="${error}"
              class="alert alert-danger"
              th:text="${error}"
            ></div>

            <div
              th:if="${success}"
              class="alert alert-success"
              th:text="${success}"
            ></div>

            <form
              th:action="@{/profile/change-password}"
              method="post"
              data-disable-submit="true"
            >
              <div class="mb-3">
                <label class="form-label">
                  Mật khẩu hiện tại
                  <span class="text-danger">*</span>
                </label>

                <input
                  type="password"
                  name="currentPassword"
                  class="form-control"
                  placeholder="Nhập mật khẩu hiện tại"
                  required
                />
              </div>

              <div class="mb-3">
                <label class="form-label">
                  Mật khẩu mới
                  <span class="text-danger">*</span>
                </label>

                <input
                  type="password"
                  name="newPassword"
                  class="form-control"
                  placeholder="Nhập mật khẩu mới"
                  minlength="6"
                  required
                />

                <div class="form-text">
                  Mật khẩu mới nên có tối thiểu 6 ký tự.
                </div>
              </div>

              <div class="mb-3">
                <label class="form-label">
                  Xác nhận mật khẩu mới
                  <span class="text-danger">*</span>
                </label>

                <input
                  type="password"
                  name="confirmPassword"
                  class="form-control"
                  placeholder="Nhập lại mật khẩu mới"
                  minlength="6"
                  required
                />
              </div>

              <hr class="my-4" />

              <div class="d-flex justify-content-between gap-2">
                <a th:href="@{/profile}" class="btn btn-outline-secondary">
                  Hủy
                </a>

                <button type="submit" class="btn btn-primary">
                  Cập nhật mật khẩu
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script th:src="@{/js/app.js}"></script>
  </body>
</html>
