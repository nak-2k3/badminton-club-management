<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <title>Dashboard</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5">
      <h2 class="mb-4">Dashboard quản lý CLB Cầu lông</h2>

      <div class="row">
        <div class="col-md-3">
          <div class="card text-white bg-primary mb-3">
            <div class="card-body">
              <h5 class="card-title">Tổng thành viên</h5>

              <h2 th:text="${totalUsers}"></h2>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card text-white bg-success mb-3">
            <div class="card-body">
              <h5 class="card-title">Thành viên hoạt động</h5>

              <h2 th:text="${activeUsers}"></h2>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card text-white bg-danger mb-3">
            <div class="card-body">
              <h5 class="card-title">Tài khoản bị khóa</h5>

              <h2 th:text="${lockedUsers}"></h2>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card text-white bg-warning mb-3">
            <div class="card-body">
              <h5 class="card-title">Tổng lịch đánh</h5>

              <h2 th:text="${totalSchedules}"></h2>
            </div>
          </div>
        </div>
      </div>

      <div class="col-md-3">
        <div class="card text-white bg-info mb-3">
          <div class="card-body">
            <h5 class="card-title">Tổng lượt đăng ký</h5>

            <h2 th:text="${totalRegistrations}"></h2>
          </div>
        </div>
      </div>
      <div class="card mt-4">
        <div class="card-header">5 lịch đánh gần nhất</div>

        <div class="card-body">
          <table class="table table-bordered table-striped">
            <thead class="table-dark">
              <tr>
                <th>STT</th>
                <th>Tiêu đề</th>
                <th>Sân</th>
                <th>Thời gian</th>
                <th>Trạng thái</th>
              </tr>
            </thead>

            <tbody>
              <tr th:each="schedule, stat : ${latestSchedules}">
                <td th:text="${stat.count}"></td>

                <td th:text="${schedule.title}"></td>

                <td th:text="${schedule.courtName}"></td>

                <td
                  th:text="${schedule.playTime != null ? #temporals.format(schedule.playTime, 'dd/MM/yyyy HH:mm') : 'Chưa cập nhật'}"
                ></td>

                <td
                  th:text="${schedule.status != null ? schedule.status.displayName : 'Chưa cập nhật'}"
                ></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
