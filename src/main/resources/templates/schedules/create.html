<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Tạo lịch đánh</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5">
      <h2 class="mb-4">Tạo lịch đánh</h2>

      <form
        th:action="@{/schedules/save}"
        th:object="${schedule}"
        method="post"
      >
        <div class="mb-3">
          <label>Tiêu đề</label>

          <input type="text" th:field="*{title}" class="form-control" />
        </div>

        <div class="mb-3">
          <label>Tên sân</label>

          <input type="text" th:field="*{courtName}" class="form-control" />
        </div>

        <div class="mb-3">
          <label>Thời gian</label>

          <input
            type="datetime-local"
            th:field="*{playTime}"
            class="form-control"
          />
        </div>

        <div class="mb-3">
          <label>Giới hạn người</label>

          <input type="number" th:field="*{maxPlayers}" class="form-control" />
        </div>

        <button type="submit" class="btn btn-primary">Lưu lịch</button>
      </form>
    </div>
  </body>
</html>
