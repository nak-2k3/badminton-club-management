<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Tạo lịch đánh</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
    />
  </head>

  <body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5 mb-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Tạo lịch đánh</h2>

        <a th:href="@{/schedules}" class="btn btn-secondary">Quay lại</a>
      </div>

      <form
        th:action="@{/schedules/save}"
        th:object="${schedule}"
        method="post"
      >
        <div class="mb-3">
          <label class="form-label">Tiêu đề</label>

          <input
            type="text"
            th:field="*{title}"
            class="form-control"
            placeholder="Ví dụ: Đánh cầu vui vẻ"
          />

          <div
            class="text-danger"
            th:if="${#fields.hasErrors('title')}"
            th:errors="*{title}"
          ></div>
        </div>

        <div class="mb-3">
          <label class="form-label">Tên sân</label>

          <input
            type="text"
            th:field="*{courtName}"
            class="form-control"
            placeholder="Ví dụ: Sân Sơn Lâm"
          />

          <div
            class="text-danger"
            th:if="${#fields.hasErrors('courtName')}"
            th:errors="*{courtName}"
          ></div>
        </div>

        <div class="mb-3">
          <label class="form-label">Thời gian</label>

          <input
            type="text"
            th:field="*{playTime}"
            class="form-control datetime-picker"
            placeholder="Chọn ngày giờ đánh"
            autocomplete="off"
          />

          <div class="form-text">Chọn ngày và giờ diễn ra buổi đánh.</div>

          <div
            class="text-danger"
            th:if="${#fields.hasErrors('playTime')}"
            th:errors="*{playTime}"
          ></div>
        </div>

        <div class="mb-3">
          <label class="form-label">Giới hạn người</label>

          <input
            type="number"
            min="1"
            th:field="*{maxPlayers}"
            class="form-control"
            placeholder="Ví dụ: 10"
          />

          <div class="form-text">
            Giới hạn này sẽ tính cả thành viên đăng ký và khách vãng lai.
          </div>

          <div
            class="text-danger"
            th:if="${#fields.hasErrors('maxPlayers')}"
            th:errors="*{maxPlayers}"
          ></div>
        </div>

        <button type="submit" class="btn btn-primary">Lưu lịch</button>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <script>
      flatpickr(".datetime-picker", {
        enableTime: true,
        time_24hr: true,
        minuteIncrement: 15,
        altInput: true,
        altFormat: "d/m/Y H:i",
        dateFormat: "Y-m-d\\TH:i",
        allowInput: false,
      });
    </script>
  </body>
</html>
