<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Lịch đánh</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5">
      <h2 class="mb-4">Danh sách lịch đánh</h2>

      <a href="/schedules/create" class="btn btn-success mb-3"> Tạo lịch </a>

      <table class="table table-bordered">
        <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Tiêu đề</th>
            <th>Sân</th>
            <th>Thời gian</th>
            <th>Giới hạn</th>
            <th>Khóa</th>
            <th>Tham gia</th>
            <th>Số người</th>
            <th>Người tham gia</th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="schedule : ${schedules}">
            <td th:text="${schedule.id}"></td>

            <td th:text="${schedule.title}"></td>

            <td th:text="${schedule.courtName}"></td>

            <td th:text="${schedule.playTime}"></td>

            <td th:text="${schedule.maxPlayers}"></td>

            <td th:text="${schedule.locked}"></td>
            <td>
              <a
                th:href="@{/schedules/register/{id}(id=${schedule.id})}"
                class="btn btn-primary btn-sm"
              >
                Tham gia
              </a>
            </td>
            <td>
              <span th:text="${schedule.currentPlayers}"></span>
              /
              <span th:text="${schedule.maxPlayers}"></span>
            </td>
            <td>
              <a
                th:href="@{/schedules/participants/{id}(id=${schedule.id})}"
                class="btn btn-info btn-sm"
              >
                Xem
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
