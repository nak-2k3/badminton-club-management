<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Người tham gia</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5">
      <h2 class="mb-4">Danh sách người tham gia</h2>

      <table class="table table-bordered">
        <thead class="table-dark">
          <tr>
            <th>ID</th>

            <th>Họ tên</th>

            <th>Email</th>

            <th>Trình độ</th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="registration : ${registrations}">
            <td th:text="${registration.user.id}"></td>

            <td th:text="${registration.user.fullName}"></td>

            <td th:text="${registration.user.email}"></td>

            <td th:text="${registration.user.level}"></td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
