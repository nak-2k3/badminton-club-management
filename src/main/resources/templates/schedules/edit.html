<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Cập nhật lịch đánh</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5 mb-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Cập nhật lịch đánh</h2>

        <a href="/schedules" class="btn btn-secondary"> Quay lại </a>
      </div>

      <form
        th:action="@{/schedules/save}"
        th:object="${schedule}"
        method="post"
      >
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
          <label class="form-label">Tiêu đề</label>

          <input type="text" th:field="*{title}" class="form-control" />

          <div
            class="text-danger"
            th:if="${#fields.hasErrors('title')}"
            th:errors="*{title}"
          ></div>
        </div>

        <div class="mb-3">
          <label class="form-label">Tên sân</label>

          <input type="text" th:field="*{courtName}" class="form-control" />

          <div
            class="text-danger"
            th:if="${#fields.hasErrors('courtName')}"
            th:errors="*{courtName}"
          ></div>
        </div>

        <div class="mb-3">
          <label class="form-label">Thời gian</label>

          <input
            type="datetime-local"
            th:field="*{playTime}"
            class="form-control"
          />

          <div
            class="text-danger"
            th:if="${#fields.hasErrors('playTime')}"
            th:errors="*{playTime}"
          ></div>
        </div>

        <div class="mb-3">
          <label class="form-label">Giới hạn người</label>

          <input
            type="number"
            min="1"
            th:field="*{maxPlayers}"
            class="form-control"
          />

          <div
            class="text-danger"
            th:if="${#fields.hasErrors('maxPlayers')}"
            th:errors="*{maxPlayers}"
          ></div>
        </div>

        <div class="mb-3">
          <label class="form-label">Trạng thái</label>

          <select th:field="*{status}" class="form-select">
            <option value="OPEN">Đang mở</option>

            <option value="LOCKED">Đã khóa đăng ký</option>

            <option value="CANCELLED">Đã hủy</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary">Cập nhật</button>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
