<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Tạo quỹ tháng</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5 mb-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Tạo quỹ tháng</h2>
        <div th:if="${param.duplicate}" class="alert alert-danger">
          Khoản thu này đã tồn tại. Vui lòng kiểm tra lại tên khoản thu hoặc
          tháng thu.
        </div>
        <a th:href="@{/payments}" class="btn btn-secondary"> Quay lại </a>
      </div>

      <div class="card mb-4">
        <div class="card-header bg-dark text-white">Định mức hiện tại</div>

        <div class="card-body">
          <p>
            <strong>Nam:</strong>
            <span
              th:text="${#numbers.formatInteger(setting.maleMonthlyFee, 0, 'COMMA')} + ' VNĐ'"
            ></span>
          </p>

          <p>
            <strong>Nữ:</strong>
            <span
              th:text="${#numbers.formatInteger(setting.femaleMonthlyFee, 0, 'COMMA')} + ' VNĐ'"
            ></span>
          </p>

          <p>
            <strong>Khách vãng lai:</strong>
            <span
              th:text="${#numbers.formatInteger(setting.guestSessionFee, 0, 'COMMA')} + ' VNĐ/buổi'"
            ></span>
          </p>

          <a th:href="@{/fee-settings}" class="btn btn-outline-primary btn-sm">
            Cập nhật định mức
          </a>
        </div>
      </div>

      <form
        th:action="@{/payments/create-monthly}"
        th:object="${batch}"
        method="post"
      >
        <div class="mb-3">
          <label class="form-label">Tên khoản thu</label>

          <input
            type="text"
            th:field="*{title}"
            class="form-control"
            placeholder="Ví dụ: Quỹ tháng 06/2026"
            required
          />
        </div>

        <div class="mb-3">
          <label class="form-label">Tháng thu</label>

          <input type="month" name="monthKey" class="form-control" required />
        </div>

        <div class="mb-3">
          <label class="form-label">Hạn chót đóng</label>

          <input
            type="text"
            name="dueDate"
            class="form-control date-format"
            placeholder="Ví dụ: 20/06/2026"
          />
        </div>

        <div class="mb-3">
          <label class="form-label">Ghi chú</label>

          <textarea
            th:field="*{note}"
            class="form-control"
            rows="3"
            placeholder="Ví dụ: Phí sinh hoạt CLB tháng 6"
          >
          </textarea>
        </div>

        <div class="alert alert-warning">
          Khi bấm tạo, hệ thống sẽ tự động tạo khoản thu cho toàn bộ thành viên
          đang hoạt động. Nam sẽ áp dụng phí nam, nữ sẽ áp dụng phí nữ.
        </div>

        <button type="submit" class="btn btn-success">Tạo quỹ tháng</button>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      document.querySelectorAll(".date-format").forEach(function (input) {
        input.addEventListener("input", function () {
          let value = input.value.replace(/\D/g, "");

          if (value.length > 2) {
            value = value.substring(0, 2) + "/" + value.substring(2);
          }

          if (value.length > 5) {
            value = value.substring(0, 5) + "/" + value.substring(5, 9);
          }

          input.value = value;
        });
      });
    </script>
  </body>
</html>
