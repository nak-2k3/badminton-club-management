<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Quản lý thu phí</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5">
      <div class="d-flex justify-content-between mb-4">
        <h2>Quản lý thu phí</h2>

        <a href="/payments/create" class="btn btn-success"> Tạo khoản thu </a>
      </div>

      <table class="table table-bordered table-striped">
        <thead class="table-dark">
          <tr>
            <th>STT</th>
            <th>Thành viên</th>
            <th>Tháng</th>
            <th>Số tiền</th>
            <th>Ghi chú</th>
            <th>Trạng thái</th>
            <th>Ngày đóng</th>
            <th>Hành động</th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="payment, stat : ${payments}">
            <td th:text="${stat.count}"></td>

            <td th:text="${payment.user.fullName}"></td>

            <td th:text="${payment.month}"></td>

            <td
              th:text="${#numbers.formatInteger(payment.amount,0,'COMMA')} + ' VNĐ'"
            ></td>
            <td
              th:text="${payment.note != null && !payment.note.isEmpty() ? payment.note : '---'}"
            ></td>
            <td>
              <span
                th:if="${payment.status.name() == 'PAID'}"
                class="badge bg-success"
              >
                Đã đóng
              </span>

              <span
                th:unless="${payment.status.name() == 'PAID'}"
                class="badge bg-danger"
              >
                Chưa đóng
              </span>
            </td>

            <td
              th:text="${payment.paidDate != null ? #temporals.format(payment.paidDate,'dd/MM/yyyy') : '-'}"
            ></td>

            <td>
              <a
                th:if="${payment.status.name() == 'UNPAID'}"
                th:href="@{/payments/paid/{id}(id=${payment.id})}"
                class="btn btn-success btn-sm"
              >
                Đã đóng
              </a>

              <a
                th:if="${payment.status.name() == 'PAID'}"
                th:href="@{/payments/unpaid/{id}(id=${payment.id})}"
                class="btn btn-warning btn-sm"
              >
                Hoàn tác
              </a>
              <a
                th:href="@{/payments/edit/{id}(id=${payment.id})}"
                class="btn btn-warning btn-sm"
              >
                Sửa
              </a>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
</html>
