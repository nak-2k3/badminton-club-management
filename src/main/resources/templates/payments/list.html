<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Quản lý khoản thu</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5 mb-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Quản lý khoản thu</h2>

        <div>
          <a th:href="@{/fee-settings}" class="btn btn-outline-secondary">
            Định mức phí
          </a>

          <a th:href="@{/payments/create-monthly}" class="btn btn-success">
            Tạo quỹ tháng
          </a>
        </div>
      </div>

      <div class="alert alert-info">
        Trang này hiển thị các đợt thu của câu lạc bộ. Bấm
        <strong>Xem chi tiết</strong>
        để quản lý từng thành viên đã đóng hay chưa đóng.
      </div>

      <table class="table table-bordered table-striped align-middle">
        <thead class="table-dark">
          <tr>
            <th>STT</th>
            <th>Tên khoản thu</th>
            <th>Tháng</th>
            <th>Hạn chót</th>
            <th>Tổng phải thu</th>
            <th>Đã thu</th>
            <th>Còn thiếu</th>
            <th>Tiến độ</th>
            <th>Hành động</th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="batch, stat : ${batches}">
            <td th:text="${stat.count}"></td>

            <td>
              <strong th:text="${batch.title}"></strong>
              <div
                class="text-muted small"
                th:text="${batch.note != null && !batch.note.isEmpty() ? batch.note : ''}"
              ></div>
            </td>

            <td
              th:text="${batch.month != null && !batch.month.isEmpty() ? batch.month : '-'}"
            ></td>

            <td
              th:text="${batch.dueDate != null ? #temporals.format(batch.dueDate, 'dd/MM/yyyy') : '-'}"
            ></td>

            <td
              th:text="${#numbers.formatInteger(paymentService.getTotalAmountByBatch(batch), 0, 'COMMA')} + ' VNĐ'"
            ></td>

            <td
              class="text-success fw-bold"
              th:text="${#numbers.formatInteger(paymentService.getPaidAmountByBatch(batch), 0, 'COMMA')} + ' VNĐ'"
            ></td>

            <td
              class="text-danger fw-bold"
              th:text="${#numbers.formatInteger(paymentService.getUnpaidAmountByBatch(batch), 0, 'COMMA')} + ' VNĐ'"
            ></td>

            <td style="min-width: 150px">
              <div class="progress" style="height: 22px">
                <div
                  class="progress-bar"
                  role="progressbar"
                  th:style="'width: ' + ${paymentService.getProgressPercent(batch)} + '%'"
                  th:text="${paymentService.getProgressPercent(batch)} + '%'"
                ></div>
              </div>
            </td>

            <td>
              <a
                th:href="@{/payments/detail/{id}(id=${batch.id})}"
                class="btn btn-primary btn-sm"
              >
                Xem chi tiết
              </a>
            </td>
          </tr>

          <tr th:if="${#lists.isEmpty(batches)}">
            <td colspan="9" class="text-center text-muted">
              Chưa có đợt thu nào.
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
