<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <title>Cập nhật khoản thu</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>

  <body
    hx-boost="true"
    hx-target="#main-content"
    hx-select="#main-content"
    hx-push-url="true"
    hx-swap="innerHTML"
  >
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main id="main-content" class="app-main">
      <div class="container app-page-container">
        <div class="page-header">
          <div>
            <h2 class="page-title">Cập nhật khoản thu</h2>

            <p class="page-subtitle">
              Chỉnh sửa số tiền, trạng thái thanh toán, hình thức và ghi chú.
            </p>
          </div>

          <div class="page-actions">
            <a
              th:href="@{/payments/detail/{id}(id=${payment.batch.id})}"
              class="btn btn-outline-secondary"
            >
              Quay lại
            </a>
          </div>
        </div>

        <div class="card">
          <div
            class="card-header bg-dark text-white d-flex justify-content-between align-items-center flex-wrap gap-2"
          >
            <span>Thông tin khoản thu</span>

            <span class="small">
              ID:
              <strong th:text="${payment.id}">1</strong>
            </span>
          </div>

          <div class="card-body">
            <form
              th:action="@{/payments/update}"
              method="post"
              data-disable-submit="true"
            >
              <input type="hidden" name="id" th:value="${payment.id}" />

              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Đợt thu</label>

                  <input
                    type="text"
                    class="form-control"
                    th:value="${payment.batch.title}"
                    readonly
                  />
                </div>

                <div class="col-md-6">
                  <label class="form-label">Thành viên</label>

                  <input
                    type="text"
                    class="form-control"
                    th:value="${payment.user.fullName}"
                    readonly
                  />
                </div>

                <div class="col-md-6">
                  <label class="form-label">
                    Số tiền
                    <span class="text-danger">*</span>
                  </label>

                  <input
                    type="number"
                    name="amount"
                    class="form-control"
                    min="1000"
                    step="1000"
                    th:value="${payment.amount}"
                    required
                  />

                  <div class="form-text">
                    Nhập số tiền không dùng dấu chấm. Ví dụ: 300000
                  </div>
                </div>

                <div class="col-md-6">
                  <label class="form-label">Trạng thái</label>

                  <select name="status" class="form-select">
                    <option
                      value="UNPAID"
                      th:selected="${payment.status.name() == 'UNPAID'}"
                    >
                      Chưa đóng
                    </option>

                    <option
                      value="PAID"
                      th:selected="${payment.status.name() == 'PAID'}"
                    >
                      Đã đóng
                    </option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label class="form-label">Hình thức thanh toán</label>

                  <select name="paymentMethod" class="form-select">
                    <option value="">Chưa chọn</option>

                    <option
                      value="Tiền mặt"
                      th:selected="${payment.paymentMethod == 'Tiền mặt'}"
                    >
                      Tiền mặt
                    </option>

                    <option
                      value="Chuyển khoản"
                      th:selected="${payment.paymentMethod == 'Chuyển khoản'}"
                    >
                      Chuyển khoản
                    </option>
                  </select>
                </div>

                <div class="col-12">
                  <label class="form-label">Ghi chú</label>

                  <textarea
                    name="note"
                    class="form-control"
                    rows="3"
                    th:text="${payment.note}"
                  ></textarea>
                </div>
              </div>

              <hr class="my-4" />

              <div class="d-flex justify-content-end gap-2">
                <a
                  th:href="@{/payments/detail/{id}(id=${payment.batch.id})}"
                  class="btn btn-outline-secondary"
                >
                  Hủy
                </a>

                <button type="submit" class="btn btn-primary">
                  Lưu thay đổi
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script th:src="@{/js/app.js}"></script>
  </body>
</html>
