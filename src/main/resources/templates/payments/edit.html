<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Cập nhật khoản thu</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5 mb-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Cập nhật khoản thu</h2>

        <a href="/payments" class="btn btn-secondary"> Quay lại </a>
      </div>

      <form th:action="@{/payments/save}" th:object="${payment}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
          <label class="form-label">Thành viên</label>

          <input
            type="text"
            class="form-control"
            th:value="${payment.user.fullName}"
            readonly
          />
          <input type="hidden" th:field="*{user}" />
        </div>

        <div class="mb-3">
          <label class="form-label">Tháng thu</label>

          <input
            type="text"
            th:field="*{month}"
            class="form-control"
            placeholder="06/2026"
          />
        </div>

        <div class="mb-3">
          <label class="form-label">Số tiền</label>

          <input
            type="number"
            th:field="*{amount}"
            class="form-control"
            min="1000"
            step="1000"
            placeholder="Ví dụ: 300000"
          />

          <div class="form-text">
            Nhập số tiền không dùng dấu chấm. Ví dụ: 300000
          </div>
        </div>
        <div class="mb-3">
          <label>Ghi chú</label>

          <textarea
            th:field="*{note}"
            class="form-control"
            rows="3"
            placeholder="Ví dụ: Phí CLB tháng 6"
          >
          </textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Trạng thái</label>

          <select th:field="*{status}" class="form-select">
            <option value="UNPAID">Chưa đóng</option>

            <option value="PAID">Đã đóng</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary">Cập nhật</button>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
