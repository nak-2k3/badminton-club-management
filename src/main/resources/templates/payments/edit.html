<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Cập nhật khoản thu</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5 mb-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Cập nhật khoản thu</h2>

        <a
          th:href="@{/payments/detail/{id}(id=${payment.batch.id})}"
          class="btn btn-secondary"
        >
          Quay lại
        </a>
      </div>

      <form th:action="@{/payments/update}" method="post">
        <input type="hidden" name="id" th:value="${payment.id}" />

        <div class="mb-3">
          <label class="form-label">Đợt thu</label>

          <input
            type="text"
            class="form-control"
            th:value="${payment.batch.title}"
            readonly
          />
        </div>

        <div class="mb-3">
          <label class="form-label">Thành viên</label>

          <input
            type="text"
            class="form-control"
            th:value="${payment.user.fullName}"
            readonly
          />
        </div>

        <div class="mb-3">
          <label class="form-label">Số tiền</label>

          <input
            type="number"
            name="amount"
            class="form-control"
            min="1000"
            step="1000"
            th:value="${payment.amount}"
            required
          />

          <div class="form-text">
            Nhập số tiền không dùng dấu chấm. Ví dụ: 300000
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Trạng thái</label>

          <select name="status" class="form-select">
            <option
              value="UNPAID"
              th:selected="${payment.status.name() == 'UNPAID'}"
            >
              Chưa đóng
            </option>

            <option
              value="PAID"
              th:selected="${payment.status.name() == 'PAID'}"
            >
              Đã đóng
            </option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Hình thức thanh toán</label>

          <select name="paymentMethod" class="form-select">
            <option value="">Chưa chọn</option>

            <option
              value="Tiền mặt"
              th:selected="${payment.paymentMethod == 'Tiền mặt'}"
            >
              Tiền mặt
            </option>

            <option
              value="Chuyển khoản"
              th:selected="${payment.paymentMethod == 'Chuyển khoản'}"
            >
              Chuyển khoản
            </option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Ghi chú</label>

          <textarea
            name="note"
            class="form-control"
            rows="3"
            th:text="${payment.note}"
          >
          </textarea>
        </div>

        <button type="submit" class="btn btn-primary">Cập nhật</button>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
