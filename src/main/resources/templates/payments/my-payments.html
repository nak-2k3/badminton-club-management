<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Khoản phí của tôi</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5 mb-5">
      <h2 class="mb-4">Khoản phí của tôi</h2>

      <div class="row mb-4">
        <div class="col-md-4">
          <div class="card text-bg-primary">
            <div class="card-body">
              <h6>Tổng phải đóng</h6>
              <h4
                th:text="${#numbers.formatInteger(totalAmount, 0, 'COMMA')} + ' VNĐ'"
              ></h4>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card text-bg-success">
            <div class="card-body">
              <h6>Đã đóng</h6>
              <h4
                th:text="${#numbers.formatInteger(paidAmount, 0, 'COMMA')} + ' VNĐ'"
              ></h4>
            </div>
          </div>
        </div>

        <div class="col-md-4">
          <div class="card text-bg-danger">
            <div class="card-body">
              <h6>Còn thiếu</h6>
              <h4
                th:text="${#numbers.formatInteger(unpaidAmount, 0, 'COMMA')} + ' VNĐ'"
              ></h4>
            </div>
          </div>
        </div>
      </div>

      <table class="table table-bordered table-striped align-middle">
        <thead class="table-dark">
          <tr>
            <th>STT</th>
            <th>Khoản thu</th>
            <th>Tháng / Đợt</th>
            <th>Hạn chót</th>
            <th>Số tiền</th>
            <th>Trạng thái</th>
            <th>Ngày đóng</th>
            <th>Hình thức</th>
            <th>Ghi chú</th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="payment, stat : ${payments}">
            <td th:text="${stat.count}"></td>

            <td
              th:text="${payment.batch != null ? payment.batch.title : '-'}"
            ></td>

            <td
              th:text="${payment.batch != null && payment.batch.month != null ? payment.batch.month : '-'}"
            ></td>

            <td
              th:text="${payment.batch != null && payment.batch.dueDate != null ? #temporals.format(payment.batch.dueDate, 'dd/MM/yyyy') : '-'}"
            ></td>

            <td
              th:text="${#numbers.formatInteger(payment.amount, 0, 'COMMA')} + ' VNĐ'"
            ></td>

            <td>
              <span
                th:if="${payment.status.name() == 'PAID'}"
                class="badge bg-success"
              >
                Đã đóng
              </span>

              <span
                th:if="${payment.status.name() == 'UNPAID'}"
                class="badge bg-danger"
              >
                Chưa đóng
              </span>
            </td>

            <td
              th:text="${payment.paidDate != null ? #temporals.format(payment.paidDate, 'dd/MM/yyyy') : '-'}"
            ></td>

            <td
              th:text="${payment.paymentMethod != null ? payment.paymentMethod : '-'}"
            ></td>

            <td
              th:text="${payment.note != null && !payment.note.isEmpty() ? payment.note : '-'}"
            ></td>
          </tr>

          <tr th:if="${#lists.isEmpty(payments)}">
            <td colspan="9" class="text-center text-muted">
              Bạn chưa có khoản phí nào.
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
