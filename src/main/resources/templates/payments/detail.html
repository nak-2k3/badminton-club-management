<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Chi tiết khoản thu</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5 mb-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 th:text="${batch.title}"></h2>

          <div class="text-muted">
            Tháng:
            <span th:text="${batch.month != null ? batch.month : '-'}"></span>
            | Hạn chót:
            <span
              th:text="${batch.dueDate != null ? #temporals.format(batch.dueDate, 'dd/MM/yyyy') : '-'}"
            ></span>
          </div>
        </div>

        <a th:href="@{/payments}" class="btn btn-secondary"> Quay lại </a>
      </div>

      <div class="row mb-4">
        <div class="col-md-3">
          <div class="card text-bg-primary">
            <div class="card-body">
              <h6>Tổng phải thu</h6>
              <h4
                th:text="${#numbers.formatInteger(totalAmount, 0, 'COMMA')} + ' VNĐ'"
              ></h4>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card text-bg-success">
            <div class="card-body">
              <h6>Đã thu</h6>
              <h4
                th:text="${#numbers.formatInteger(paidAmount, 0, 'COMMA')} + ' VNĐ'"
              ></h4>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card text-bg-danger">
            <div class="card-body">
              <h6>Còn thiếu</h6>
              <h4
                th:text="${#numbers.formatInteger(unpaidAmount, 0, 'COMMA')} + ' VNĐ'"
              ></h4>
            </div>
          </div>
        </div>

        <div class="col-md-3">
          <div class="card text-bg-dark">
            <div class="card-body">
              <h6>Tiến độ</h6>
              <h4 th:text="${progressPercent} + '%'"></h4>
            </div>
          </div>
        </div>
      </div>

      <div class="mb-3">
        <div class="progress" style="height: 25px">
          <div
            class="progress-bar"
            role="progressbar"
            th:style="'width: ' + ${progressPercent} + '%'"
            th:text="${progressPercent} + '%'"
          ></div>
        </div>
      </div>

      <table class="table table-bordered table-striped align-middle">
        <thead class="table-dark">
          <tr>
            <th>STT</th>
            <th>Thành viên</th>
            <th>Giới tính</th>
            <th>Số tiền phải đóng</th>
            <th>Trạng thái</th>
            <th>Ngày đóng</th>
            <th>Hình thức</th>
            <th>Ghi chú</th>
            <th>Hành động</th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="payment, stat : ${payments}">
            <td th:text="${stat.count}"></td>

            <td th:text="${payment.user.fullName}"></td>

            <td
              th:text="${payment.user.gender != null ? payment.user.gender.displayName : '-'}"
            ></td>

            <td
              th:text="${#numbers.formatInteger(payment.amount, 0, 'COMMA')} + ' VNĐ'"
            ></td>

            <td>
              <span
                th:if="${payment.status.name() == 'PAID'}"
                class="badge bg-success"
              >
                Đã đóng
              </span>

              <span
                th:if="${payment.status.name() == 'UNPAID'}"
                class="badge bg-danger"
              >
                Chưa đóng
              </span>
            </td>

            <td
              th:text="${payment.paidDate != null ? #temporals.format(payment.paidDate, 'dd/MM/yyyy') : '-'}"
            ></td>

            <td
              th:text="${payment.paymentMethod != null ? payment.paymentMethod : '-'}"
            ></td>

            <td
              th:text="${payment.note != null && !payment.note.isEmpty() ? payment.note : '-'}"
            ></td>

            <td>
              <a
                th:href="@{/payments/edit/{id}(id=${payment.id})}"
                class="btn btn-warning btn-sm mb-1"
              >
                Sửa
              </a>

              <form
                th:if="${payment.status.name() == 'UNPAID'}"
                th:action="@{/payments/paid/{id}(id=${payment.id})}"
                method="post"
                class="d-inline"
              >
                <select
                  name="paymentMethod"
                  class="form-select form-select-sm d-inline w-auto"
                >
                  <option value="Tiền mặt">Tiền mặt</option>
                  <option value="Chuyển khoản">Chuyển khoản</option>
                </select>

                <button type="submit" class="btn btn-success btn-sm">
                  Xác nhận đã thu
                </button>
              </form>

              <form
                th:if="${payment.status.name() == 'PAID'}"
                th:action="@{/payments/unpaid/{id}(id=${payment.id})}"
                method="post"
                class="d-inline"
              >
                <button type="submit" class="btn btn-secondary btn-sm">
                  Hoàn tác
                </button>
              </form>
            </td>
          </tr>

          <tr th:if="${#lists.isEmpty(payments)}">
            <td colspan="9" class="text-center text-muted">
              Chưa có khoản thu nào trong đợt này.
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
