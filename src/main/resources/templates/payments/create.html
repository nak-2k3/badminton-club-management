<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Tạo khoản thu</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5">
      <h2 class="mb-4">Tạo khoản thu</h2>

      <form th:action="@{/payments/save}" th:object="${payment}" method="post">
        <div class="mb-3">
          <label>Thành viên</label>

          <select th:field="*{user}" class="form-select">
            <option
              th:each="user : ${users}"
              th:value="${user.id}"
              th:text="${user.fullName}"
            ></option>
          </select>
        </div>

        <div class="mb-3">
          <label>Tháng thu</label>

          <input
            type="text"
            th:field="*{month}"
            class="form-control"
            placeholder="06/2026"
          />
        </div>

        <div class="mb-3">
          <label>Số tiền</label>

          <input type="number" th:field="*{amount}" class="form-control" />
        </div>
        <div class="mb-3">
          <label>Ghi chú</label>

          <textarea
            th:field="*{note}"
            class="form-control"
            rows="3"
            placeholder="Ví dụ: Phí CLB tháng 6"
          >
          </textarea>
        </div>
        <button class="btn btn-primary">Lưu</button>
      </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
