<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <title>Tạo khoản thu</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>

  <body
    hx-boost="true"
    hx-target="#main-content"
    hx-select="#main-content"
    hx-push-url="true"
    hx-swap="innerHTML"
  >
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main id="main-content" class="app-main">
      <div class="container app-page-container">
        <div class="page-header">
          <div>
            <h2 class="page-title">Tạo khoản thu</h2>

            <p class="page-subtitle">
              Tạo khoản thu thủ công cho một thành viên.
            </p>
          </div>

          <div class="page-actions">
            <a th:href="@{/payments}" class="btn btn-outline-secondary">
              Quay lại
            </a>
          </div>
        </div>

        <div class="card">
          <div class="card-header bg-dark text-white">Thông tin khoản thu</div>

          <div class="card-body">
            <form
              th:action="@{/payments/save}"
              th:object="${payment}"
              method="post"
              data-disable-submit="true"
            >
              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">Thành viên</label>

                  <select th:field="*{user}" class="form-select">
                    <option
                      th:each="user : ${users}"
                      th:value="${user.id}"
                      th:text="${user.fullName}"
                    ></option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label class="form-label">Tháng thu</label>

                  <input
                    type="text"
                    th:field="*{month}"
                    class="form-control"
                    placeholder="06/2026"
                  />
                </div>

                <div class="col-md-6">
                  <label class="form-label">Số tiền</label>

                  <input
                    type="number"
                    th:field="*{amount}"
                    class="form-control"
                    min="1000"
                    step="1000"
                  />
                </div>

                <div class="col-12">
                  <label class="form-label">Ghi chú</label>

                  <textarea
                    th:field="*{note}"
                    class="form-control"
                    rows="3"
                    placeholder="Ví dụ: Phí CLB tháng 6"
                  ></textarea>
                </div>
              </div>

              <hr class="my-4" />

              <div class="d-flex justify-content-end gap-2">
                <a th:href="@{/payments}" class="btn btn-outline-secondary">
                  Hủy
                </a>

                <button type="submit" class="btn btn-primary">Lưu</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script th:src="@{/js/app.js}"></script>
  </body>
</html>
