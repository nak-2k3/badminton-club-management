<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <body>
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm"
      th:fragment="navbar"
    >
      <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}"> 🏸 Badminton Club </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
          aria-controls="navbarNav"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <!-- Menu bên trái -->
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" th:href="@{/}"> Trang chủ </a>
            </li>

            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
              <a class="nav-link" th:href="@{/users}"> Thành viên </a>
            </li>

            <li class="nav-item" sec:authorize="isAuthenticated()">
              <a class="nav-link" th:href="@{/schedules}"> Lịch đánh </a>
            </li>

            <!-- Nhóm tài chính -->
            <li
              class="nav-item dropdown"
              sec:authorize="hasAnyRole('ADMIN','TREASURER')"
            >
              <a
                class="nav-link dropdown-toggle"
                href="#"
                id="financeDropdown"
                role="button"
                data-bs-toggle="dropdown"
                aria-expanded="false"
              >
                Tài chính
              </a>

              <ul class="dropdown-menu" aria-labelledby="financeDropdown">
                <li>
                  <a class="dropdown-item" th:href="@{/payments}">
                    Quản lý khoản thu
                  </a>
                </li>

                <li>
                  <a class="dropdown-item" th:href="@{/fee-settings}">
                    Định mức phí
                  </a>
                </li>
                <li>
                  <a class="dropdown-item" th:href="@{/expenses}">
                    Quản lý khoản chi
                  </a>
                </li>
                <li>
                  <a class="dropdown-item" th:href="@{/reports/finance}">
                    Báo cáo thu chi
                  </a>
                </li>
              </ul>
            </li>
            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
              <a class="nav-link" th:href="@{/dashboard}"> Thống kê </a>
            </li>
          </ul>

          <!-- Bên phải: chưa đăng nhập -->
          <div sec:authorize="!isAuthenticated()">
            <a th:href="@{/login}" class="btn btn-outline-light btn-sm">
              Đăng nhập
            </a>
          </div>

          <!-- Bên phải: đã đăng nhập -->
          <div sec:authorize="isAuthenticated()" class="dropdown">
            <button
              class="btn btn-outline-light btn-sm dropdown-toggle"
              type="button"
              id="userDropdown"
              data-bs-toggle="dropdown"
              aria-expanded="false"
            >
              Xin chào,
              <span sec:authentication="name"></span>
            </button>

            <ul
              class="dropdown-menu dropdown-menu-end"
              aria-labelledby="userDropdown"
            >
              <li>
                <h6 class="dropdown-header">
                  Vai trò:
                  <span sec:authorize="hasRole('ADMIN')"> Quản trị viên </span>

                  <span sec:authorize="hasRole('MEMBER')"> Thành viên </span>

                  <span sec:authorize="hasRole('TREASURER')"> Thủ quỹ </span>
                </h6>
              </li>

              <li>
                <hr class="dropdown-divider" />
              </li>

              <li>
                <a class="dropdown-item" th:href="@{/profile}">
                  Hồ sơ cá nhân
                </a>
              </li>
              <li>
                <a class="dropdown-item" th:href="@{/my-payments}">
                  Khoản phí của tôi
                </a>
              </li>
              <li>
                <hr class="dropdown-divider" />
              </li>

              <li>
                <form th:action="@{/logout}" method="post">
                  <button type="submit" class="dropdown-item text-danger">
                    Đăng xuất
                  </button>
                </form>
              </li>
            </ul>
          </div>
        </div>
      </div>
    </nav>
  </body>
</html>
