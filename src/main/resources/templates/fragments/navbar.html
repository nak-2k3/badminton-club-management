<!doctype html>
<html
  xmlns:th="http://www.thymeleaf.org"
  xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
>
  <body>
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-dark"
      th:fragment="navbar"
    >
      <div class="container">
        <a class="navbar-brand" href="/"> Badminton Club </a>

        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav me-auto">
            <li class="nav-item">
              <a class="nav-link" href="/"> Trang chủ </a>
            </li>

            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
              <a class="nav-link" href="/users"> Thành viên </a>
            </li>

            <li class="nav-item">
              <a class="nav-link" href="/schedules"> Lịch đánh </a>
            </li>

            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
              <a class="nav-link" href="/dashboard"> Thống kê </a>
            </li>
          </ul>

          <div
            sec:authorize="isAuthenticated()"
            class="d-flex align-items-center"
          >
            <span class="text-light me-3">
              Xin chào,
              <span sec:authentication="name"></span>
            </span>

            <span class="text-warning me-3" sec:authorize="hasRole('ADMIN')">
              Quản trị viên
            </span>

            <span class="text-warning me-3" sec:authorize="hasRole('MEMBER')">
              Thành viên
            </span>

            <span
              class="text-warning me-3"
              sec:authorize="hasRole('TREASURER')"
            >
              Thủ quỹ
            </span>

            <form th:action="@{/logout}" method="post">
              <button class="btn btn-outline-light">Đăng xuất</button>
            </form>
          </div>

          <div sec:authorize="!isAuthenticated()">
            <a href="/login" class="btn btn-outline-light"> Đăng nhập </a>
          </div>
        </div>
      </div>
    </nav>
  </body>
</html>
