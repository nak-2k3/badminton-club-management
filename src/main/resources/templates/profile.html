<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Hồ sơ cá nhân</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5">
      <div class="card shadow-sm">
        <div class="card-header bg-dark text-white">
          <h4 class="mb-0">Hồ sơ cá nhân</h4>
        </div>

        <div class="card-body">
          <div class="row mb-3">
            <div class="col-md-3 fw-bold">Họ tên:</div>
            <div class="col-md-9" th:text="${user.fullName}"></div>
          </div>

          <div class="row mb-3">
            <div class="col-md-3 fw-bold">Email:</div>
            <div class="col-md-9" th:text="${user.email}"></div>
          </div>

          <div class="row mb-3">
            <div class="col-md-3 fw-bold">Số điện thoại:</div>
            <div class="col-md-9" th:text="${user.phone}"></div>
          </div>

          <div class="row mb-3">
            <div class="col-md-3 fw-bold">Giới tính:</div>
            <div
              class="col-md-9"
              th:text="${user.gender != null ? user.gender.displayName : 'Chưa cập nhật'}"
            ></div>
          </div>

          <div class="row mb-3">
            <div class="col-md-3 fw-bold">Ngày sinh:</div>
            <div
              class="col-md-9"
              th:text="${user.birthDate != null ? #temporals.format(user.birthDate, 'dd/MM/yyyy') : 'Chưa cập nhật'}"
            ></div>
          </div>

          <div class="row mb-3">
            <div class="col-md-3 fw-bold">Địa chỉ:</div>
            <div
              class="col-md-9"
              th:text="${user.address != null ? user.address : 'Chưa cập nhật'}"
            ></div>
          </div>

          <div class="row mb-3">
            <div class="col-md-3 fw-bold">Vai trò:</div>
            <div
              class="col-md-9"
              th:text="${user.role != null ? user.role.displayName : 'Chưa cập nhật'}"
            ></div>
          </div>

          <div class="row mb-3">
            <div class="col-md-3 fw-bold">Trình độ:</div>
            <div
              class="col-md-9"
              th:text="${user.level != null ? user.level.displayName : 'Chưa cập nhật'}"
            ></div>
          </div>

          <div class="row mb-3">
            <div class="col-md-3 fw-bold">Ngày tham gia CLB:</div>
            <div
              class="col-md-9"
              th:text="${user.joinDate != null ? #temporals.format(user.joinDate, 'dd/MM/yyyy') : 'Chưa cập nhật'}"
            ></div>
          </div>

          <div class="row mb-3">
            <div class="col-md-3 fw-bold">Trạng thái:</div>
            <div class="col-md-9">
              <span th:if="${user.enabled}" class="badge bg-success">
                Đang hoạt động
              </span>

              <span th:unless="${user.enabled}" class="badge bg-danger">
                Đã khóa
              </span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
