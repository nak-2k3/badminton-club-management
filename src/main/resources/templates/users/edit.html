<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Cập nhật thành viên</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container mt-5">
      <h2 class="mb-4">Cập nhật thành viên</h2>

      <form th:action="@{/users/save}" th:object="${user}" method="post">
        <input type="hidden" th:field="*{id}" />

        <div class="mb-3">
          <label>Họ tên</label>
          <input type="text" th:field="*{fullName}" class="form-control" />
          <div
            class="text-danger"
            th:if="${#fields.hasErrors('fullName')}"
            th:errors="*{fullName}"
          ></div>
        </div>

        <div class="mb-3">
          <label>Email</label>
          <input type="email" th:field="*{email}" class="form-control" />
          <div
            class="text-danger"
            th:if="${#fields.hasErrors('email')}"
            th:errors="*{email}"
          ></div>
        </div>

        <div class="mb-3">
          <label>Password</label>
          <input type="password" th:field="*{password}" class="form-control" />
          <div
            class="text-danger"
            th:if="${#fields.hasErrors('password')}"
            th:errors="*{password}"
          ></div>
        </div>

        <div class="mb-3">
          <label>Số điện thoại</label>
          <input type="text" th:field="*{phone}" class="form-control" />
          <div
            class="text-danger"
            th:if="${#fields.hasErrors('phone')}"
            th:errors="*{phone}"
          ></div>
        </div>

        <div class="mb-3">
          <label>Vai trò</label>

          <select th:field="*{role}" class="form-select">
            <option value="MEMBER">Member</option>
            <option value="ADMIN">Admin</option>
            <option value="TREASURER">Treasurer</option>
          </select>
        </div>

        <div class="mb-3">
          <label>Trình độ</label>

          <select th:field="*{level}" class="form-select">
            <option value="Beginner">Beginner</option>
            <option value="Intermediate">Intermediate</option>
            <option value="Advanced">Advanced</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary">Cập nhật</button>
      </form>
    </div>
  </body>
</html>
