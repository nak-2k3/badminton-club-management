<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <title>Cập nhật thành viên</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
    />

    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>

  <body
    hx-boost="true"
    hx-target="#main-content"
    hx-select="#main-content"
    hx-push-url="true"
    hx-swap="innerHTML"
  >
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main id="main-content" class="app-main">
      <div class="container app-page-container">
        <div class="page-header">
          <div>
            <h2 class="page-title">Cập nhật thành viên</h2>

            <p class="page-subtitle">
              Chỉnh sửa thông tin cá nhân, vai trò, trình độ và trạng thái tài
              khoản.
            </p>
          </div>

          <div class="page-actions">
            <a th:href="@{/users}" class="btn btn-outline-secondary">
              Quay lại
            </a>
          </div>
        </div>

        <div class="card">
          <div
            class="card-header bg-dark text-white d-flex justify-content-between align-items-center flex-wrap gap-2"
          >
            <span>Thông tin thành viên</span>

            <span class="small" th:if="${user.id != null}">
              ID:
              <strong th:text="${user.id}">1</strong>
            </span>
          </div>

          <div class="card-body">
            <form
              th:action="@{/users/save}"
              th:object="${user}"
              method="post"
              data-disable-submit="true"
            >
              <input type="hidden" th:field="*{id}" />

              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">
                    Họ tên
                    <span class="text-danger">*</span>
                  </label>

                  <input
                    type="text"
                    th:field="*{fullName}"
                    class="form-control"
                    placeholder="Ví dụ: Nguyễn Văn A"
                  />

                  <div
                    class="text-danger small mt-1"
                    th:if="${#fields.hasErrors('fullName')}"
                    th:errors="*{fullName}"
                  ></div>
                </div>

                <div class="col-md-6">
                  <label class="form-label">
                    Email
                    <span class="text-danger">*</span>
                  </label>

                  <input
                    type="email"
                    th:field="*{email}"
                    class="form-control"
                    placeholder="Ví dụ: user@gmail.com"
                  />

                  <div
                    class="text-danger small mt-1"
                    th:if="${#fields.hasErrors('email')}"
                    th:errors="*{email}"
                  ></div>
                </div>

                <div class="col-md-6">
                  <label class="form-label">Mật khẩu mới</label>

                  <input
                    type="password"
                    name="newPassword"
                    class="form-control"
                    placeholder="Để trống nếu không đổi mật khẩu"
                  />

                  <div class="form-text">
                    Chỉ nhập nếu muốn thay đổi mật khẩu.
                  </div>
                </div>

                <div class="col-md-6">
                  <label class="form-label">Số điện thoại</label>

                  <input
                    type="text"
                    th:field="*{phone}"
                    class="form-control"
                    placeholder="Ví dụ: 0901234567"
                  />

                  <div
                    class="text-danger small mt-1"
                    th:if="${#fields.hasErrors('phone')}"
                    th:errors="*{phone}"
                  ></div>
                </div>

                <div class="col-md-4">
                  <label class="form-label">Vai trò</label>

                  <select th:field="*{role}" class="form-select">
                    <option value="ADMIN">Quản trị viên</option>
                    <option value="MEMBER">Thành viên</option>
                    <option value="TREASURER">Thủ quỹ</option>
                  </select>
                </div>

                <div class="col-md-4">
                  <label class="form-label">Giới tính</label>

                  <select th:field="*{gender}" class="form-select">
                    <option value="">-- Chọn giới tính --</option>
                    <option value="MALE">Nam</option>
                    <option value="FEMALE">Nữ</option>
                    <option value="OTHER">Khác</option>
                  </select>
                </div>

                <div class="col-md-4">
                  <label class="form-label">Trình độ</label>

                  <select th:field="*{level}" class="form-select">
                    <option value="">-- Chọn trình độ --</option>
                    <option value="BEGINNER">Mới bắt đầu</option>
                    <option value="INTERMEDIATE">Trung bình</option>
                    <option value="ADVANCED">Nâng cao</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label class="form-label">Ngày sinh</label>

                  <input
                    type="text"
                    name="birthDate"
                    class="form-control date-picker"
                    placeholder="Chọn ngày sinh"
                    autocomplete="off"
                    th:value="${user.birthDate != null ? #temporals.format(user.birthDate, 'dd/MM/yyyy') : ''}"
                  />
                </div>

                <div class="col-md-6">
                  <label class="form-label">Ngày tham gia CLB</label>

                  <input
                    type="text"
                    name="joinDate"
                    class="form-control date-picker"
                    placeholder="Chọn ngày tham gia CLB"
                    autocomplete="off"
                    th:value="${user.joinDate != null ? #temporals.format(user.joinDate, 'dd/MM/yyyy') : ''}"
                  />
                </div>

                <div class="col-12">
                  <label class="form-label">Địa chỉ</label>

                  <input
                    type="text"
                    th:field="*{address}"
                    class="form-control"
                    placeholder="Nhập địa chỉ"
                  />
                </div>

                <div class="col-12">
                  <div class="form-check mt-2">
                    <input
                      class="form-check-input"
                      type="checkbox"
                      th:field="*{enabled}"
                    />

                    <label class="form-check-label fw-semibold">
                      Tài khoản hoạt động
                    </label>
                  </div>
                </div>
              </div>

              <hr class="my-4" />

              <div class="d-flex justify-content-end gap-2">
                <a th:href="@{/users}" class="btn btn-outline-secondary">
                  Hủy
                </a>

                <button type="submit" class="btn btn-primary">
                  Lưu thay đổi
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script th:src="@{/js/app.js}"></script>
  </body>
</html>
