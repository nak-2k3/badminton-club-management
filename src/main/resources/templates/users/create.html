<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Thêm thành viên</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <div class="container mt-5">
      <h2 class="mb-4">Thêm thành viên</h2>

      <form th:action="@{/users/save}" th:object="${user}" method="post">
        <div class="mb-3">
          <label>Họ tên</label>
          <input type="text" th:field="*{fullName}" class="form-control" />
          <div
            class="text-danger"
            th:if="${#fields.hasErrors('fullName')}"
            th:errors="*{fullName}"
          ></div>
        </div>

        <div class="mb-3">
          <label>Email</label>
          <input type="email" th:field="*{email}" class="form-control" />
          <div
            class="text-danger"
            th:if="${#fields.hasErrors('email')}"
            th:errors="*{email}"
          ></div>
        </div>

        <div class="mb-3">
          <label>Password</label>
          <input type="password" th:field="*{password}" class="form-control" />
          <div
            class="text-danger"
            th:if="${#fields.hasErrors('password')}"
            th:errors="*{password}"
          ></div>
        </div>

        <div class="mb-3">
          <label>Số điện thoại</label>
          <input type="text" th:field="*{phone}" class="form-control" />
          <div
            class="text-danger"
            th:if="${#fields.hasErrors('phone')}"
            th:errors="*{phone}"
          ></div>
        </div>

        <div class="mb-3">
          <label>Vai trò</label>
          <select th:field="*{role}" class="form-select">
            <option value="ADMIN">ADMIN</option>
            <option value="MEMBER">MEMBER</option>
            <option value="TREASURER">TREASURER</option>
          </select>
        </div>

        <div class="mb-3">
          <label>Giới tính</label>
          <select th:field="*{gender}" class="form-select">
            <option value="MALE">Nam</option>
            <option value="FEMALE">Nữ</option>
            <option value="OTHER">Khác</option>
          </select>
        </div>

        <div class="mb-3">
          <label>Trình độ</label>
          <select th:field="*{level}" class="form-select">
            <option value="BEGINNER">Beginner</option>
            <option value="INTERMEDIATE">Intermediate</option>
            <option value="ADVANCED">Advanced</option>
          </select>
        </div>

        <div class="mb-3">
          <label>Ngày sinh</label>
          <input type="date" th:field="*{birthDate}" class="form-control" />
        </div>

        <div class="mb-3">
          <label>Địa chỉ</label>
          <input type="text" th:field="*{address}" class="form-control" />
        </div>

        <div class="mb-3">
          <label>Ngày tham gia CLB</label>
          <input type="date" th:field="*{joinDate}" class="form-control" />
        </div>

        <button type="submit" class="btn btn-primary">Lưu thành viên</button>
      </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
