<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Thêm thành viên</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
    />
  </head>

  <body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5 mb-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Thêm thành viên</h2>

        <a th:href="@{/users}" class="btn btn-secondary">Quay lại</a>
      </div>

      <form th:action="@{/users/save}" th:object="${user}" method="post">
        <div class="mb-3">
          <label class="form-label">Họ tên</label>

          <input
            type="text"
            th:field="*{fullName}"
            class="form-control"
            placeholder="Ví dụ: Nguyễn Văn A"
          />

          <div
            class="text-danger"
            th:if="${#fields.hasErrors('fullName')}"
            th:errors="*{fullName}"
          ></div>
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>

          <input
            type="email"
            th:field="*{email}"
            class="form-control"
            placeholder="Ví dụ: user@gmail.com"
          />

          <div
            class="text-danger"
            th:if="${#fields.hasErrors('email')}"
            th:errors="*{email}"
          ></div>
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>

          <input
            type="password"
            th:field="*{password}"
            class="form-control"
            placeholder="Nhập mật khẩu"
          />

          <div
            class="text-danger"
            th:if="${#fields.hasErrors('password')}"
            th:errors="*{password}"
          ></div>
        </div>

        <div class="mb-3">
          <label class="form-label">Số điện thoại</label>

          <input
            type="text"
            th:field="*{phone}"
            class="form-control"
            placeholder="Ví dụ: 0901234567"
          />

          <div
            class="text-danger"
            th:if="${#fields.hasErrors('phone')}"
            th:errors="*{phone}"
          ></div>
        </div>

        <div class="mb-3">
          <label class="form-label">Vai trò</label>

          <select th:field="*{role}" class="form-select">
            <option value="ADMIN">ADMIN</option>
            <option value="MEMBER">MEMBER</option>
            <option value="TREASURER">TREASURER</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Giới tính</label>

          <select th:field="*{gender}" class="form-select">
            <option value="MALE">Nam</option>
            <option value="FEMALE">Nữ</option>
            <option value="OTHER">Khác</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Trình độ</label>

          <select th:field="*{level}" class="form-select">
            <option value="BEGINNER">Beginner</option>
            <option value="INTERMEDIATE">Intermediate</option>
            <option value="ADVANCED">Advanced</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Ngày sinh</label>

          <input
            type="text"
            th:field="*{birthDate}"
            class="form-control date-picker"
            placeholder="Chọn ngày sinh"
            autocomplete="off"
          />
        </div>

        <div class="mb-3">
          <label class="form-label">Địa chỉ</label>

          <input
            type="text"
            th:field="*{address}"
            class="form-control"
            placeholder="Nhập địa chỉ"
          />
        </div>

        <div class="mb-3">
          <label class="form-label">Ngày tham gia CLB</label>

          <input
            type="text"
            th:field="*{joinDate}"
            class="form-control date-picker"
            placeholder="Chọn ngày tham gia CLB"
            autocomplete="off"
          />
        </div>

        <button type="submit" class="btn btn-primary">Lưu thành viên</button>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

    <script>
      flatpickr(".date-picker", {
        dateFormat: "d/m/Y",
        allowInput: true,
      });
    </script>
  </body>
</html>
