<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Cấu hình định mức phí</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5 mb-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Cấu hình định mức phí</h2>

        <a href="/payments" class="btn btn-secondary"> Quay lại </a>
      </div>

      <div th:if="${param.success}" class="alert alert-success">
        Cập nhật định mức phí thành công.
      </div>

      <div class="card">
        <div class="card-header bg-dark text-white">
          Định mức quỹ tháng định kỳ
        </div>

        <div class="card-body">
          <form
            th:action="@{/fee-settings/save}"
            th:object="${setting}"
            method="post"
          >
            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
              <label class="form-label"> Phí thành viên nam </label>

              <input
                type="number"
                th:field="*{maleMonthlyFee}"
                class="form-control"
                min="0"
                step="1000"
                placeholder="Ví dụ: 300000"
              />

              <div class="form-text">
                Nhập số tiền không dùng dấu chấm. Ví dụ: 300000
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label"> Phí thành viên nữ </label>

              <input
                type="number"
                th:field="*{femaleMonthlyFee}"
                class="form-control"
                min="0"
                step="1000"
                placeholder="Ví dụ: 200000"
              />

              <div class="form-text">
                Nhập số tiền không dùng dấu chấm. Ví dụ: 200000
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label"> Phí khách vãng lai / buổi </label>

              <input
                type="number"
                th:field="*{guestSessionFee}"
                class="form-control"
                min="0"
                step="1000"
                placeholder="Ví dụ: 50000"
              />

              <div class="form-text">
                Khoản này dùng để tham khảo hoặc thu khách vãng lai.
              </div>
            </div>

            <button type="submit" class="btn btn-primary">Lưu cấu hình</button>
          </form>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
