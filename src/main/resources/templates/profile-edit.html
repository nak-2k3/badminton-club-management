<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Chỉnh sửa hồ sơ</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5 mb-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Chỉnh sửa hồ sơ cá nhân</h2>

        <a href="/profile" class="btn btn-secondary"> Quay lại </a>
      </div>

      <form th:action="@{/profile/update}" th:object="${user}" method="post">
        <input type="hidden" th:field="*{email}" />
        <input type="hidden" th:field="*{password}" />
        <div class="mb-3">
          <label class="form-label">Họ tên</label>
          <input type="text" th:field="*{fullName}" class="form-control" />

          <div
            class="text-danger"
            th:if="${#fields.hasErrors('fullName')}"
            th:errors="*{fullName}"
          ></div>
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input
            type="email"
            th:value="${user.email}"
            class="form-control"
            readonly
          />
        </div>

        <div class="mb-3">
          <label class="form-label">Số điện thoại</label>
          <input type="text" th:field="*{phone}" class="form-control" />

          <div
            class="text-danger"
            th:if="${#fields.hasErrors('phone')}"
            th:errors="*{phone}"
          ></div>
        </div>

        <div class="mb-3">
          <label class="form-label">Giới tính</label>

          <select th:field="*{gender}" class="form-select">
            <option value="">-- Chọn giới tính --</option>
            <option value="MALE">Nam</option>
            <option value="FEMALE">Nữ</option>
            <option value="OTHER">Khác</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Ngày sinh</label>

          <input
            type="text"
            name="birthDate"
            class="form-control date-format"
            maxlength="10"
            placeholder="dd/MM/yyyy"
            th:value="${user.birthDate != null ? #temporals.format(user.birthDate, 'dd/MM/yyyy') : ''}"
          />
        </div>

        <div class="mb-3">
          <label class="form-label">Địa chỉ</label>
          <input type="text" th:field="*{address}" class="form-control" />
        </div>

        <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      document.querySelectorAll(".date-format").forEach((input) => {
        input.addEventListener("input", function (e) {
          let value = e.target.value.replace(/\D/g, "");

          if (value.length > 2) {
            value = value.substring(0, 2) + "/" + value.substring(2);
          }

          if (value.length > 5) {
            value = value.substring(0, 5) + "/" + value.substring(5, 9);
          }

          e.target.value = value;
        });
      });
    </script>
  </body>
</html>
