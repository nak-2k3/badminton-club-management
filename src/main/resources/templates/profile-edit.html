<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <title>Chỉnh sửa hồ sơ</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>

  <body
    hx-boost="true"
    hx-target="#main-content"
    hx-select="#main-content"
    hx-push-url="true"
    hx-swap="innerHTML"
  >
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <main id="main-content" class="app-main">
      <div class="container app-page-container">
        <div class="page-header">
          <div>
            <h2 class="page-title">Chỉnh sửa hồ sơ cá nhân</h2>

            <p class="page-subtitle">
              Cập nhật thông tin liên hệ, ngày sinh, giới tính và địa chỉ.
            </p>
          </div>

          <div class="page-actions">
            <a th:href="@{/profile}" class="btn btn-outline-secondary">
              Quay lại
            </a>
          </div>
        </div>

        <div class="card">
          <div class="card-header bg-dark text-white">Thông tin cá nhân</div>

          <div class="card-body">
            <form
              th:action="@{/profile/update}"
              th:object="${user}"
              method="post"
              data-disable-submit="true"
            >
              <input type="hidden" th:field="*{email}" />
              <input type="hidden" th:field="*{password}" />

              <div class="row g-3">
                <div class="col-md-6">
                  <label class="form-label">
                    Họ tên
                    <span class="text-danger">*</span>
                  </label>

                  <input
                    type="text"
                    th:field="*{fullName}"
                    class="form-control"
                    placeholder="Nhập họ tên"
                    required
                  />

                  <div
                    class="text-danger small mt-1"
                    th:if="${#fields.hasErrors('fullName')}"
                    th:errors="*{fullName}"
                  ></div>
                </div>

                <div class="col-md-6">
                  <label class="form-label">Email</label>

                  <input
                    type="email"
                    th:value="${user.email}"
                    class="form-control"
                    readonly
                  />

                  <div class="form-text">
                    Email dùng để đăng nhập, không chỉnh sửa tại đây.
                  </div>
                </div>

                <div class="col-md-6">
                  <label class="form-label">Số điện thoại</label>

                  <input
                    type="text"
                    th:field="*{phone}"
                    class="form-control"
                    placeholder="Ví dụ: 0901234567"
                  />

                  <div
                    class="text-danger small mt-1"
                    th:if="${#fields.hasErrors('phone')}"
                    th:errors="*{phone}"
                  ></div>
                </div>

                <div class="col-md-6">
                  <label class="form-label">Giới tính</label>

                  <select th:field="*{gender}" class="form-select">
                    <option value="">-- Chọn giới tính --</option>
                    <option value="MALE">Nam</option>
                    <option value="FEMALE">Nữ</option>
                  </select>
                </div>

                <div class="col-md-6">
                  <label class="form-label">Ngày sinh</label>

                  <input
                    type="text"
                    name="birthDate"
                    class="form-control date-picker"
                    placeholder="Chọn ngày sinh"
                    autocomplete="off"
                    th:value="${user.birthDate != null ? #temporals.format(user.birthDate, 'dd/MM/yyyy') : ''}"
                  />
                </div>

                <div class="col-md-6">
                  <label class="form-label">Địa chỉ</label>

                  <input
                    type="text"
                    th:field="*{address}"
                    class="form-control"
                    placeholder="Nhập địa chỉ"
                  />
                </div>
              </div>

              <hr class="my-4" />

              <div class="d-flex justify-content-end gap-2">
                <a th:href="@{/profile}" class="btn btn-outline-secondary">
                  Hủy
                </a>

                <button type="submit" class="btn btn-primary">
                  Lưu thay đổi
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <script th:src="@{/js/app.js}"></script>
  </body>
</html>
