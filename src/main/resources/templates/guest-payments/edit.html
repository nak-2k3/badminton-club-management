<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Cập nhật khách vãng lai</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5 mb-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Cập nhật khách vãng lai</h2>
        <div th:if="${param.full}" class="alert alert-danger">
          Buổi đánh mới đã đủ số lượng người tham gia. Không thể chuyển khách
          sang buổi này.
        </div>
        <a th:href="@{/guest-payments}" class="btn btn-secondary"> Quay lại </a>
      </div>

      <form th:action="@{/guest-payments/update}" method="post">
        <input type="hidden" name="id" th:value="${guestPayment.id}" />

        <div class="mb-3">
          <label class="form-label">Buổi đánh</label>

          <select name="scheduleId" class="form-select" required>
            <option
              th:each="schedule : ${schedules}"
              th:value="${schedule.id}"
              th:selected="${guestPayment.schedule != null && guestPayment.schedule.id == schedule.id}"
              th:text="${schedule.title + ' - ' + #temporals.format(schedule.playTime, 'dd/MM/yyyy HH:mm')}"
            ></option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Tên khách</label>

          <input
            type="text"
            name="guestName"
            class="form-control"
            th:value="${guestPayment.guestName}"
            required
          />
        </div>

        <div class="mb-3">
          <label class="form-label">Số điện thoại</label>

          <input
            type="text"
            name="phone"
            class="form-control"
            th:value="${guestPayment.phone}"
          />
        </div>

        <div class="mb-3">
          <label class="form-label">Số tiền</label>

          <input
            type="number"
            name="amount"
            class="form-control"
            min="1000"
            step="1000"
            th:value="${guestPayment.amount}"
            required
          />
        </div>

        <div class="mb-3">
          <label class="form-label">Ghi chú</label>

          <textarea
            name="note"
            class="form-control"
            rows="3"
            th:text="${guestPayment.note}"
          >
          </textarea>
        </div>

        <button type="submit" class="btn btn-primary">Cập nhật</button>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
