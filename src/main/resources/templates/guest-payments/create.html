<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>Thêm khách vãng lai</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container mt-5 mb-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Thêm khách vãng lai</h2>

        <a th:href="@{/guest-payments}" class="btn btn-secondary"> Quay lại </a>
      </div>

      <form
        th:action="@{/guest-payments/save}"
        th:object="${guestPayment}"
        method="post"
      >
        <div class="mb-3">
          <label class="form-label">Buổi đánh</label>

          <select name="scheduleId" class="form-select" required>
            <option value="">-- Chọn buổi đánh --</option>

            <option
              th:each="schedule : ${schedules}"
              th:value="${schedule.id}"
              th:text="${schedule.title + ' - ' + #temporals.format(schedule.playTime, 'dd/MM/yyyy HH:mm')}"
            ></option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label">Tên khách</label>

          <input
            type="text"
            th:field="*{guestName}"
            class="form-control"
            placeholder="Ví dụ: Nguyễn Văn A"
            required
          />
        </div>

        <div class="mb-3">
          <label class="form-label">Số điện thoại</label>

          <input
            type="text"
            th:field="*{phone}"
            class="form-control"
            placeholder="Ví dụ: 0901234567"
          />
        </div>

        <div class="mb-3">
          <label class="form-label">Số tiền</label>

          <input
            type="number"
            th:field="*{amount}"
            class="form-control"
            min="1000"
            step="1000"
            required
          />

          <div class="form-text">
            Mặc định lấy theo định mức phí khách vãng lai.
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Ghi chú</label>

          <textarea
            th:field="*{note}"
            class="form-control"
            rows="3"
            placeholder="Ví dụ: Khách đi cùng thành viên A"
          >
          </textarea>
        </div>

        <button type="submit" class="btn btn-success">
          Lưu khách vãng lai
        </button>
      </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
