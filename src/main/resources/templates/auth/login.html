<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />

    <title>Đăng nhập</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" th:href="@{/css/style.css}" />
  </head>

  <body style="background: #f5f7fb">
    <div
      class="min-vh-100 d-flex align-items-center justify-content-center px-3"
    >
      <div
        class="card shadow-sm border-0"
        style="max-width: 460px; width: 100%"
      >
        <div class="card-body p-4 p-md-5">
          <div class="text-center mb-4">
            <div
              class="rounded-circle bg-primary-subtle text-primary d-inline-flex align-items-center justify-content-center mb-3"
              style="width: 72px; height: 72px; font-size: 34px"
            >
              🏸
            </div>

            <h3 class="fw-bold mb-1">Đăng nhập</h3>

            <div class="text-muted">Hệ thống quản lý câu lạc bộ cầu lông</div>
          </div>

          <div th:if="${param.error}" class="alert alert-danger">
            Email hoặc mật khẩu không đúng. Vui lòng kiểm tra lại.
          </div>

          <div th:if="${param.logout}" class="alert alert-success">
            Bạn đã đăng xuất thành công.
          </div>

          <form th:action="@{/login}" method="post">
            <div class="mb-3">
              <label class="form-label">
                Email
                <span class="text-danger">*</span>
              </label>

              <input
                type="email"
                name="username"
                class="form-control"
                placeholder="Nhập email đăng nhập"
                autocomplete="username"
                required
              />
            </div>

            <div class="mb-4">
              <label class="form-label">
                Mật khẩu
                <span class="text-danger">*</span>
              </label>

              <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Nhập mật khẩu"
                autocomplete="current-password"
                required
              />
            </div>

            <button type="submit" class="btn btn-primary w-100">
              Đăng nhập
            </button>
          </form>

          <div class="text-center text-muted small mt-4">
            Badminton Club Management
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
